# Builds libnmvlm.so, the picture-to-prompt engine (GitHub #120): llama.cpp's mtmd + ggml (CPU and Hexagon)
# linked statically into our JNI bridge (engines/vlm/nmvlm.cpp), plus the Hexagon DSP skels.
#
# Inside llama.cpp's documented Snapdragon toolchain container (docs/backend/snapdragon/README.md), which carries
# the NDK and the Hexagon SDK. llama.cpp is cloned at a pinned tag and its commit is checked, so a rebuild is the
# same engine; nothing from it is vendored here. The result is uploaded as an artifact, then published once as a
# tag-pinned release asset the app downloads (`vlm/VlmEngine.kt`), the way the DiT engine is.
name: vlm-engine

on:
  workflow_dispatch:
    inputs:
      llama_tag:
        description: "llama.cpp tag"
        default: "v1.0.0"
      llama_sha:
        description: "the commit that tag must be (blank skips the check)"
        default: "a6d1a74dbebce3a16f4f2ceddbf38c21a08d8674"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.8
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: nightmare

      - name: Clone llama.cpp at the pinned tag
        run: |
          git clone --depth 1 --branch "${{ inputs.llama_tag }}" https://github.com/ggml-org/llama.cpp.git llama.cpp
          SHA=$(git -C llama.cpp rev-parse HEAD)
          echo "llama.cpp ${{ inputs.llama_tag }} = $SHA"
          if [ -n "${{ inputs.llama_sha }}" ] && [ "$SHA" != "${{ inputs.llama_sha }}" ]; then
            echo "::error::the tag moved: $SHA, expected ${{ inputs.llama_sha }}"; exit 1
          fi
          echo "LLAMA_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          echo "NDK=$ANDROID_NDK_ROOT"; echo "HEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT"; echo "HEXAGON_TOOLS_ROOT=$HEXAGON_TOOLS_ROOT"
          cmake --version; ninja --version || true; df -h . || true

      # ⚠ armv8.7a+i8mm as llama.cpp's own Android preset: the engine is offered only on Snapdragons with an NPU
      # skel (v73 and newer), whose cores all have i8mm (GitHub #147 was a Tensor phone).
      - name: Configure
        run: |
          FLAGS="-march=armv8.7a+fp16+dotprod+i8mm -fvectorize -ffp-model=fast -fno-finite-math-only -D_GNU_SOURCE"
          cmake -S nightmare/engines/vlm -B build -G Ninja \
            -DLLAMA_SRC="$PWD/llama.cpp" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DHEXAGON_SDK_ROOT="$HEXAGON_SDK_ROOT" -DHEXAGON_TOOLS_ROOT="$HEXAGON_TOOLS_ROOT" \
            -DPREBUILT_LIB_DIR=android_aarch64

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Collect
        run: |
          mkdir -p out
          cp build/libnmvlm.so out/
          "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded out/libnmvlm.so
          find build -name 'libggml-htp-v*.so' -exec cp {} out/ \;
          ls -la out
          "$ANDROID_NDK_ROOT"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d out/libnmvlm.so | grep NEEDED
          # ⚠ cmake, not zip: the container need not carry zip.
          cd out && cmake -E tar cf ../vlm-engine.zip --format=zip -- *.so && cd ..
          {
            echo "### vlm engine"
            echo "llama.cpp ${{ inputs.llama_tag }} \`$LLAMA_SHA\`"
            echo '```'
            echo "BYTES = $(stat -c%s vlm-engine.zip)"
            echo "SHA256 = $(sha256sum vlm-engine.zip | cut -d' ' -f1)"
            for f in out/*.so; do echo "$(basename $f) $(stat -c%s $f)"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp vlm-engine.zip out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vlm-engine
          path: out/
          if-no-files-found: error
